<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Glow Market — Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3B1F2E;
    --ivory:#FAF5F0;
    --blush:#E8C4C4;
    --gold:#C9A227;
    --charcoal:#2B2024;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    padding-bottom:100px;
  }
  header{
    background:var(--plum);
    color:var(--ivory);
    padding:36px 20px 28px;
    text-align:center;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.2rem;
    letter-spacing:0.01em;
  }
  header p{
    margin-top:6px;
    font-size:0.9rem;
    color:var(--blush);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 20px;
    background:var(--ivory);
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid rgba(59,31,46,0.1);
  }
  .categories::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex-shrink:0;
    padding:8px 18px;
    border-radius:999px;
    border:1px solid var(--plum);
    background:transparent;
    color:var(--plum);
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .cat-btn.active, .cat-btn:hover{
    background:var(--plum);
    color:var(--ivory);
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:16px;
    padding:20px;
  }
  .card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(59,31,46,0.08);
    display:flex;
    flex-direction:column;
    transition:transform 0.2s ease;
  }
  .card:hover{ transform:translateY(-3px); }
  .card-img{
    width:100%;
    aspect-ratio:1/1;
    background:var(--blush) url('') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--plum);
    font-size:0.75rem;
  }
  .card-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-name{ font-family:'Fraunces',serif; font-weight:600; font-size:1rem; line-height:1.2;}
  .card-cat{ font-size:0.72rem; color:#8a7580; text-transform:uppercase; letter-spacing:0.04em;}
  .card-price{ font-family:'Fraunces',serif; font-weight:600; color:var(--gold); font-size:1.05rem; margin-top:auto;}
  .add-btn{
    margin-top:8px;
    background:var(--plum);
    color:var(--ivory);
    border:none;
    padding:9px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.97); }
  .add-btn.added{ background:var(--gold); color:var(--charcoal); }
  #empty-msg{
    text-align:center;
    padding:60px 20px;
    color:#8a7580;
    font-size:0.95rem;
  }
  /* Floating cart button */
  #cart-fab{
    position:fixed;
    bottom:22px;
    right:22px;
    background:var(--plum);
    color:var(--ivory);
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    box-shadow:0 4px 16px rgba(59,31,46,0.35);
    cursor:pointer;
    z-index:20;
  }
  #cart-count{
    position:absolute;
    top:-4px;
    right:-4px;
    background:var(--gold);
    color:var(--charcoal);
    font-size:0.7rem;
    font-weight:700;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Cart drawer */
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
  }
  #overlay.open{ opacity:1; pointer-events:all; }
  #drawer{
    position:fixed;
    top:0; right:0;
    width:min(360px, 88vw);
    height:100%;
    background:var(--ivory);
    box-shadow:-6px 0 24px rgba(0,0,0,0.15);
    transform:translateX(100%);
    transition:transform 0.3s ease;
    z-index:31;
    display:flex;
    flex-direction:column;
  }
  #drawer.open{ transform:translateX(0); }
  .drawer-header{
    padding:20px;
    background:var(--plum);
    color:var(--ivory);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .drawer-header h2{ font-family:'Fraunces',serif; font-size:1.3rem; font-weight:600;}
  #close-drawer{ background:none; border:none; color:var(--ivory); font-size:1.3rem; cursor:pointer;}
  #cart-items{ flex:1; overflow-y:auto; padding:16px 20px;}
  .cart-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid rgba(59,31,46,0.1);
  }
  .cart-row img{ width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--blush);}
  .cart-row-info{ flex:1; }
  .cart-row-name{ font-size:0.88rem; font-weight:600;}
  .cart-row-price{ font-size:0.78rem; color:var(--gold); font-weight:600;}
  .qty-controls{ display:flex; align-items:center; gap:8px;}
  .qty-controls button{
    width:24px; height:24px; border-radius:50%; border:1px solid var(--plum);
    background:#fff; color:var(--plum); font-size:0.9rem; cursor:pointer;
  }
  .remove-btn{ background:none; border:none; color:#b04747; font-size:0.75rem; cursor:pointer; margin-left:8px;}
  .drawer-footer{ padding:18px 20px; border-top:1px solid rgba(59,31,46,0.1);}
  .total-row{ display:flex; justify-content:space-between; font-family:'Fraunces',serif; font-size:1.1rem; font-weight:600; margin-bottom:14px;}
  #checkout-btn{
    width:100%;
    background:#25D366;
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
  }
  #checkout-btn:disabled{ background:#aaa; cursor:not-allowed; }
  #empty-cart{ text-align:center; color:#8a7580; padding:40px 0; font-size:0.9rem;}
</style>
</head>
<body>

<header>
  <h1>The Glow Market</h1>
  <p>Cosmetics <a style="text-decoration:none; cursor:none; color:var(--blush);" href="admin.html">·</a> Order in a tap</p>
</header>

<nav class="categories" id="categories"></nav>

<div id="grid"></div>
<div id="empty-msg" style="display:none;">No products yet — check back soon.</div>

<button id="cart-fab" onclick="openDrawer()">
  🛍️
  <span id="cart-count">0</span>
</button>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-header">
    <h2>Your List</h2>
    <button id="close-drawer" onclick="closeDrawer()">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span>Total</span>
      <span id="cart-total">GHS 0.00</span>
    </div>
    <button id="checkout-btn" onclick="checkoutWhatsApp()">Order via WhatsApp</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dnpiidmpsrlsunedykws.supabase.co";
  const SUPABASE_KEY = "sb_publishable__u7IojxuZGSPgl7K7a7Vug_rxIlUIn9";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allProducts = [];
  let activeCategory = "All";
  let whatsappNumber = "";
  let cart = JSON.parse(localStorage.getItem('glowmarket_cart') || '[]');

  function saveCart(){
    localStorage.setItem('glowmarket_cart', JSON.stringify(cart));
    renderCart();
  }

  async function init(){
    const { data: products, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
    if(!error) allProducts = products || [];

    const { data: settings } = await sb.from('store_settings').select('whatsapp_number').eq('id', 1).single();
    if(settings) whatsappNumber = settings.whatsapp_number || "";

    renderCategories();
    renderGrid();
    renderCart();
  }

  function renderCategories(){
    const cats = ["All", ...new Set(allProducts.map(p => p.category))];
    const wrap = document.getElementById('categories');
    wrap.innerHTML = "";
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat;
      btn.onclick = () => { activeCategory = cat; renderCategories(); renderGrid(); };
      wrap.appendChild(btn);
    });
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('empty-msg');
    const filtered = activeCategory === "All" ? allProducts : allProducts.filter(p => p.category === activeCategory);

    if(filtered.length === 0){
      grid.innerHTML = "";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    grid.innerHTML = filtered.map(p => `
      <div class="card">
        <div class="card-img">
          ${p.image_url ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">` : 'No image'}
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-cat">${escapeHtml(p.category)}</div>
          <div class="card-price">GHS ${Number(p.price).toFixed(2)}</div>
          <button class="add-btn" data-id="${p.id}" onclick="addToCart('${p.id}', this)">Add to List</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addToCart(id, btnEl){
    const product = allProducts.find(p => p.id === id);
    if(!product) return;
    const existing = cart.find(c => c.id === id);
    if(existing){ existing.qty += 1; }
    else { cart.push({ id: product.id, name: product.name, price: product.price, image_url: product.image_url, qty: 1 }); }
    saveCart();

    if(btnEl){
      btnEl.textContent = "Added ✓";
      btnEl.classList.add('added');
      setTimeout(() => { btnEl.textContent = "Add to List"; btnEl.classList.remove('added'); }, 900);
    }
  }

  function changeQty(id, delta){
    const item = cart.find(c => c.id === id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
    saveCart();
  }

  function removeItem(id){
    cart = cart.filter(c => c.id !== id);
    saveCart();
  }

  function renderCart(){
    const wrap = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-count');
    const totalEl = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    const totalCount = cart.reduce((sum, c) => sum + c.qty, 0);
    countEl.textContent = totalCount;

    if(cart.length === 0){
      wrap.innerHTML = `<div id="empty-cart">Your list is empty. Add some products to get started.</div>`;
      totalEl.textContent = "GHS 0.00";
      checkoutBtn.disabled = true;
      return;
    }
    checkoutBtn.disabled = false;

    wrap.innerHTML = cart.map(c => `
      <div class="cart-row">
        <img src="${c.image_url || ''}" alt="${escapeHtml(c.name)}">
        <div class="cart-row-info">
          <div class="cart-row-name">${escapeHtml(c.name)}</div>
          <div class="cart-row-price">GHS ${Number(c.price).toFixed(2)}</div>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty('${c.id}', -1)">−</button>
          <span>${c.qty}</span>
          <button onclick="changeQty('${c.id}', 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem('${c.id}')">Remove</button>
      </div>
    `).join('');

    const total = cart.reduce((sum, c) => sum + c.qty * Number(c.price), 0);
    totalEl.textContent = `GHS ${total.toFixed(2)}`;
  }

  function openDrawer(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }
  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function checkoutWhatsApp(){
    if(cart.length === 0) return;
    if(!whatsappNumber){
      alert("Store WhatsApp number isn't set up yet. Please contact the shop directly.");
      return;
    }
    let msg = "Hi! I'd like to order:\n\n";
    cart.forEach((c, i) => {
      msg += `${i+1}. ${c.name} — GHS ${Number(c.price).toFixed(2)} x${c.qty}\n`;
    });
    const total = cart.reduce((sum, c) => sum + c.qty * Number(c.price), 0);
    msg += `\nTotal: GHS ${total.toFixed(2)}`;

    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  init();
</script>
</body>
</html>
