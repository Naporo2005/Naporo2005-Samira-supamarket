<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muslimat Perfumes &amp; Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-green:#0E2E22;
    --deep-green-light:#154A36;
    --ivory:#FAF6EE;
    --sand:#F1E7D2;
    --gold:#C9A227;
    --gold-soft:#DFC373;
    --charcoal:#241F1C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    padding-bottom:100px;
  }
  header{
    background:var(--deep-green);
    color:var(--ivory);
    padding:34px 20px 26px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 90% -10%, rgba(201,162,39,0.18), transparent 55%),
      radial-gradient(circle at 5% 110%, rgba(201,162,39,0.12), transparent 50%);
    pointer-events:none;
  }
  header .crest{
    font-size:1.4rem;
    color:var(--gold);
    margin-bottom:4px;
    letter-spacing:0.2em;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:0.03em;
    position:relative;
  }
  header h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:1rem;
    color:var(--gold-soft);
    margin-top:2px;
    letter-spacing:0.02em;
  }
  header .divider{
    width:70px;
    height:1px;
    background:var(--gold);
    opacity:0.6;
    margin:12px auto;
  }
  header p{
    font-size:0.72rem;
    color:var(--sand);
    letter-spacing:0.12em;
    text-transform:uppercase;
  }
  .categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 20px;
    background:var(--ivory);
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid rgba(14,46,34,0.12);
  }
  .categories::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 16px 5px 5px;
    border-radius:999px;
    border:1.5px solid var(--deep-green);
    background:#fff;
    color:var(--deep-green);
    font-family:'Inter',sans-serif;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .cat-icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--deep-green);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:all 0.2s ease;
  }
  .cat-icon svg{ width:15px; height:15px; stroke:var(--gold); fill:none; stroke-width:1.6; }
  .cat-btn.active, .cat-btn:hover{
    background:var(--deep-green);
    color:var(--ivory);
  }
  .cat-btn.active .cat-icon, .cat-btn:hover .cat-icon{
    background:var(--gold);
  }
  .cat-btn.active .cat-icon svg, .cat-btn:hover .cat-icon svg{
    stroke:var(--deep-green);
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:16px;
    padding:20px;
  }
  .card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(14,46,34,0.10);
    display:flex;
    flex-direction:column;
    transition:transform 0.2s ease;
    border:1px solid rgba(201,162,39,0.15);
  }
  .card:hover{ transform:translateY(-3px); }
  .card-img{
    width:100%;
    aspect-ratio:1/1;
    background:var(--sand) url('') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-green);
    font-size:0.75rem;
  }
  .card-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-name{ font-family:'Fraunces',serif; font-weight:600; font-size:1rem; line-height:1.2; color:var(--deep-green);}
  .card-cat{ font-size:0.7rem; color:#8a7f6a; text-transform:uppercase; letter-spacing:0.05em;}
  .card-price{ font-family:'Fraunces',serif; font-weight:600; color:var(--gold); font-size:1.05rem; margin-top:auto;}
  .add-btn{
    margin-top:8px;
    background:var(--deep-green);
    color:var(--ivory);
    border:none;
    padding:9px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.97); }
  .add-btn.added{ background:var(--gold); color:var(--charcoal); }
  #empty-msg{
    text-align:center;
    padding:60px 20px;
    color:#8a7f6a;
    font-size:0.95rem;
  }
  /* Floating cart button */
  #cart-fab{
    position:fixed;
    bottom:22px;
    right:22px;
    background:var(--deep-green);
    color:var(--gold);
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    box-shadow:0 4px 16px rgba(14,46,34,0.4);
    cursor:pointer;
    z-index:20;
  }
  #cart-count{
    position:absolute;
    top:-4px;
    right:-4px;
    background:var(--gold);
    color:var(--deep-green);
    font-size:0.7rem;
    font-weight:700;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Cart drawer */
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
  }
  #overlay.open{ opacity:1; pointer-events:all; }
  #drawer{
    position:fixed;
    top:0; right:0;
    width:min(360px, 88vw);
    height:100%;
    background:var(--ivory);
    box-shadow:-6px 0 24px rgba(0,0,0,0.15);
    transform:translateX(100%);
    transition:transform 0.3s ease;
    z-index:31;
    display:flex;
    flex-direction:column;
  }
  #drawer.open{ transform:translateX(0); }
  .drawer-header{
    padding:20px;
    background:var(--deep-green);
    color:var(--ivory);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .drawer-header h2{ font-family:'Fraunces',serif; font-size:1.3rem; font-weight:600;}
  #close-drawer{ background:none; border:none; color:var(--gold); font-size:1.3rem; cursor:pointer;}
  #cart-items{ flex:1; overflow-y:auto; padding:16px 20px;}
  .cart-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid rgba(14,46,34,0.12);
  }
  .cart-row img{ width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--sand);}
  .cart-row-info{ flex:1; }
  .cart-row-name{ font-size:0.88rem; font-weight:600; color:var(--deep-green);}
  .cart-row-price{ font-size:0.78rem; color:var(--gold); font-weight:600;}
  .qty-controls{ display:flex; align-items:center; gap:8px;}
  .qty-controls button{
    width:24px; height:24px; border-radius:50%; border:1px solid var(--deep-green);
    background:#fff; color:var(--deep-green); font-size:0.9rem; cursor:pointer;
  }
  .remove-btn{ background:none; border:none; color:#b04747; font-size:0.75rem; cursor:pointer; margin-left:8px;}
  .drawer-footer{ padding:18px 20px; border-top:1px solid rgba(14,46,34,0.12);}
  .total-row{ display:flex; justify-content:space-between; font-family:'Fraunces',serif; font-size:1.1rem; font-weight:600; margin-bottom:14px; color:var(--deep-green);}
  #checkout-btn{
    width:100%;
    background:#25D366;
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
  }
  #checkout-btn:disabled{ background:#aaa; cursor:not-allowed; }
  #empty-cart{ text-align:center; color:#8a7f6a; padding:40px 0; font-size:0.9rem;}
</style>
</head>
<body>

<header>
  <div class="crest">۞</div>
  <h1>Muslimat</h1>
  <h2>Perfumes &amp; Cosmetics</h2>
  <div class="divider"></div>
  <p>Beauty <a style="text-decoration:none; cursor:none; color:var(--sand);" href="admin.html">·</a> Modesty · Confidence</p>
</header>

<nav class="categories" id="categories"></nav>

<div id="grid"></div>
<div id="empty-msg" style="display:none;">No products yet — check back soon.</div>

<button id="cart-fab" onclick="openDrawer()">
  🛍️
  <span id="cart-count">0</span>
</button>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-header">
    <h2>Your List</h2>
    <button id="close-drawer" onclick="closeDrawer()">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span>Total</span>
      <span id="cart-total">GHS 0.00</span>
    </div>
    <button id="checkout-btn" onclick="checkoutWhatsApp()">Order via WhatsApp</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dnpiidmpsrlsunedykws.supabase.co";
  const SUPABASE_KEY = "sb_publishable__u7IojxuZGSPgl7K7a7Vug_rxIlUIn9";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allProducts = [];
  let activeCategory = "All";
  let whatsappNumber = "";
  let cart = JSON.parse(localStorage.getItem('glowmarket_cart') || '[]');

  // ---- Category icon set (line-style, matches flyer badges) ----
  const ICONS = {
    all: `<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>`,
    perfume: `<svg viewBox="0 0 24 24"><path d="M9 2h6M10 2v3h4V2M8 8h8l1 2v11a1 1 0 01-1 1H8a1 1 0 01-1-1V10z"/><path d="M9 5l-1 3M15 5l1 3"/></svg>`,
    spray: `<svg viewBox="0 0 24 24"><path d="M10 3h3v3h-3zM9 6h5l1 2v12a1 1 0 01-1 1H9a1 1 0 01-1-1V8z"/><path d="M3 8l2-1M3 11l2-.5M3 14l2 .5"/></svg>`,
    lotion: `<svg viewBox="0 0 24 24"><rect x="8" y="6" width="8" height="14" rx="2"/><path d="M10 6V4a2 2 0 012-2 2 2 0 012 2v2"/><path d="M8 11h8"/></svg>`,
    skincare: `<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M7 13a5 5 0 0110 0"/><rect x="9" y="4" width="6" height="3" rx="1"/></svg>`,
    makeup: `<svg viewBox="0 0 24 24"><path d="M9 21l-2-9a3 3 0 013-3.5L15 6l1.5 1.5-2.5 5A3 3 0 0111 15z"/><path d="M15 6l3-3 2 2-3 3"/></svg>`,
    bag: `<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M8 8V6a4 4 0 018 0v2"/></svg>`,
    default: `<svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg>`
  };

  function getCategoryIcon(cat){
    const c = String(cat).toLowerCase();
    if(c === 'all') return ICONS.all;
    if(c.includes('perfume') || c.includes('fragrance') || c.includes('oud')) return ICONS.perfume;
    if(c.includes('spray') || c.includes('mist')) return ICONS.spray;
    if(c.includes('lotion') || c.includes('body')) return ICONS.lotion;
    if(c.includes('skin') || c.includes('cream') || c.includes('serum') || c.includes('face')) return ICONS.skincare;
    if(c.includes('makeup') || c.includes('cosmetic') || c.includes('lip') || c.includes('powder')) return ICONS.makeup;
    if(c.includes('accessor') || c.includes('bag') || c.includes('brush')) return ICONS.bag;
    return ICONS.default;
  }

  function saveCart(){
    localStorage.setItem('glowmarket_cart', JSON.stringify(cart));
    renderCart();
  }

  async function init(){
    const { data: products, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
    if(!error) allProducts = products || [];

    const { data: settings } = await sb.from('store_settings').select('whatsapp_number').eq('id', 1).single();
    if(settings) whatsappNumber = settings.whatsapp_number || "";

    renderCategories();
    renderGrid();
    renderCart();
  }

  function renderCategories(){
    const cats = ["All", ...new Set(allProducts.map(p => p.category))];
    const wrap = document.getElementById('categories');
    wrap.innerHTML = "";
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
      btn.innerHTML = `<span class="cat-icon">${getCategoryIcon(cat)}</span><span>${cat}</span>`;
      btn.onclick = () => { activeCategory = cat; renderCategories(); renderGrid(); };
      wrap.appendChild(btn);
    });
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('empty-msg');
    const filtered = activeCategory === "All" ? allProducts : allProducts.filter(p => p.category === activeCategory);

    if(filtered.length === 0){
      grid.innerHTML = "";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    grid.innerHTML = filtered.map(p => `
      <div class="card">
        <div class="card-img">
          ${p.image_url ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">` : 'No image'}
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-cat">${escapeHtml(p.category)}</div>
          <div class="card-price">GHS ${Number(p.price).toFixed(2)}</div>
          <button class="add-btn" data-id="${p.id}" onclick="addToCart('${p.id}', this)">Add to List</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addToCart(id, btnEl){
    const product = allProducts.find(p => p.id === id);
    if(!product) return;
    const existing = cart.find(c => c.id === id);
    if(existing){ existing.qty += 1; }
    else { cart.push({ id: product.id, name: product.name, price: product.price, image_url: product.image_url, qty: 1 }); }
    saveCart();

    if(btnEl){
      btnEl.textContent = "Added ✓";
      btnEl.classList.add('added');
      setTimeout(() => { btnEl.textContent = "Add to List"; btnEl.classList.remove('added'); }, 900);
    }
  }

  function changeQty(id, delta){
    const item = cart.find(c => c.id === id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
    saveCart();
  }

  function removeItem(id){
    cart = cart.filter(c => c.id !== id);
    saveCart();
  }

  function renderCart(){
    const wrap = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-count');
    const totalEl = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    const totalCount = cart.reduce((sum, c) => sum + c.qty, 0);
    countEl.textContent = totalCount;

    if(cart.length === 0){
      wrap.innerHTML = `<div id="empty-cart">Your list is empty. Add some products to get started.</div>`;
      totalEl.textContent = "GHS 0.00";
      checkoutBtn.disabled = true;
      return;
    }
    checkoutBtn.disabled = false;

    wrap.innerHTML = cart.map(c => `
      <div class="cart-row">
        <img src="${c.image_url || ''}" alt="${escapeHtml(c.name)}">
        <div class="cart-row-info">
          <div class="cart-row-name">${escapeHtml(c.name)}</div>
          <div class="cart-row-price">GHS ${Number(c.price).toFixed(2)}</div>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty('${c.id}', -1)">−</button>
          <span>${c.qty}</span>
          <button onclick="changeQty('${c.id}', 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem('${c.id}')">Remove</button>
      </div>
    `).join('');

    const total = cart.reduce((sum, c) => sum + c.qty * Number(c.price), 0);
    totalEl.textContent = `GHS ${total.toFixed(2)}`;
  }

  function openDrawer(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }
  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function checkoutWhatsApp(){
    if(cart.length === 0) return;
    if(!whatsappNumber){
      alert("Store WhatsApp number isn't set up yet. Please contact the shop directly.");
      return;
    }
    let msg = "Hello! I'd like to order the following:\n\n";
    cart.forEach((c, i) => {
      msg += `${i+1}. ${c.name} — GHS ${Number(c.price).toFixed(2)} x${c.qty}\n`;
    });
    const total = cart.reduce((sum, c) => sum + c.qty * Number(c.price), 0);
    msg += `\nTotal: GHS ${total.toFixed(2)}`;

    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  init();
</script>
</body>
</html>
